<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How dq-local-tts works</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="330" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">dq-local-tts: hear Claude's replies, spoken on your machine</text>

  <rect x="32" y="84" width="190" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="52" y="114" font-size="15" font-weight="700" fill="#0f172a">Claude's reply</text>
  <text x="52" y="140" font-size="13" fill="#334155">Stop / PreToolUse</text>
  <text x="52" y="158" font-size="13" fill="#334155">hooks pick up each</text>
  <text x="52" y="176" font-size="13" fill="#334155">new piece of text</text>

  <line x1="226" y1="149" x2="272" y2="149" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="276" y="84" width="230" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="296" y="114" font-size="15" font-weight="700" fill="#1e1b4b">Local daemon</text>
  <text x="296" y="140" font-size="13" fill="#3730a3">skips code blocks &amp; noise</text>
  <text x="296" y="158" font-size="13" fill="#3730a3">splits into sentences,</text>
  <text x="296" y="176" font-size="13" fill="#3730a3">synthesizes one ahead</text>
  <text x="296" y="194" font-size="13" fill="#3730a3">“stop” cuts it short</text>

  <line x1="510" y1="149" x2="556" y2="149" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="560" y="70" width="230" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="578" y="94" font-size="14" font-weight="700" fill="#064e3b">macOS built-in voices</text>
  <text x="578" y="113" font-size="12" fill="#065f46">default on a Mac · nothing to install</text>
  <rect x="560" y="134" width="230" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="578" y="159" font-size="13" fill="#334155">Kokoro, in the plugin</text>
  <rect x="560" y="182" width="230" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="578" y="207" font-size="13" fill="#334155">Kokoro server (Docker)</text>

  <line x1="794" y1="149" x2="840" y2="149" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="852" y="146" font-size="30">🔊</text>
  <text x="846" y="176" font-size="13" fill="#334155">speakers</text>

  <text x="32" y="270" font-size="13" fill="#475569">No cloud, no API key. Turn it on and off with /dq-local-tts:tts on|off, switch voices with /dq-local-tts:tts voice.</text>
  <text x="32" y="292" font-size="13" fill="#475569">Kokoro voices work on any OS; on Linux, /dq-local-tts:tts server up starts the container.</text>
</svg>
