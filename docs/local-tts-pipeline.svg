<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>dq-local-tts pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>
  <rect width="980" height="470" rx="16" fill="#ffffff"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">How a reply becomes speech</text>
  <text x="28" y="64" font-size="13" fill="#475569">The hooks decide what to say. The daemon splits and plays. The backend only turns text into audio.</text>

  <!-- this machine lane -->
  <rect x="20" y="84" width="940" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="36" y="106" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">EVERYTHING RUNS ON THIS MACHINE</text>

  <!-- 1 hooks -->
  <rect x="36" y="122" width="190" height="200" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="58" cy="146" r="12" fill="#0f172a"/><text x="58" y="151" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="78" y="151" font-size="15" font-weight="700" fill="#0f172a">Hooks</text>
  <rect x="52" y="168" width="158" height="28" rx="6" fill="#f1f5f9"/><text x="62" y="187" font-size="13" fill="#0f172a">PreToolUse</text>
  <rect x="52" y="202" width="158" height="28" rx="6" fill="#f1f5f9"/><text x="62" y="221" font-size="13" fill="#0f172a">Stop</text>
  <text x="52" y="254" font-size="12" fill="#475569">Claude Code calls them;</text><text x="52" y="238" font-size="12" fill="#475569"></text>
  <text x="52" y="270" font-size="12" fill="#475569">they return in ~0.3 s,</text>
  <text x="52" y="286" font-size="12" fill="#475569">a turn never waits</text>

  <line x1="230" y1="222" x2="262" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 worker -->
  <rect x="266" y="122" width="190" height="200" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="288" cy="146" r="12" fill="#0f172a"/><text x="288" y="151" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="308" y="151" font-size="15" font-weight="700" fill="#0f172a">Hook worker</text>
  <text x="282" y="184" font-size="13" fill="#0f172a">• only text new this turn</text>
  <text x="282" y="208" font-size="13" fill="#0f172a">• never the same text twice</text>
  <text x="282" y="232" font-size="13" fill="#0f172a">• drops code, tables,</text>
  <text x="294" y="250" font-size="13" fill="#0f172a">diffs, logs, long paths</text>
  <text x="282" y="286" font-size="12" fill="#475569">so what you hear is prose</text>

  <line x1="460" y1="222" x2="492" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 daemon -->
  <rect x="496" y="122" width="208" height="200" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="518" cy="146" r="12" fill="#4338ca"/><text x="518" y="151" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="538" y="151" font-size="15" font-weight="700" fill="#1e1b4b">Daemon</text>
  <text x="512" y="184" font-size="13" fill="#312e81">• splits into sentences,</text>
  <text x="524" y="202" font-size="13" fill="#312e81">a short one first</text>
  <text x="512" y="226" font-size="13" fill="#312e81">• asks for sentence N+1</text>
  <text x="524" y="244" font-size="13" fill="#312e81">while N is playing</text>
  <text x="512" y="268" font-size="13" fill="#312e81">• plays the audio here</text>
  <text x="512" y="296" font-size="12" fill="#4338ca">“stop” cuts it off at once</text>

  <!-- to backends -->
  <path d="M704,196 L732,196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="718" y="186" font-size="11" fill="#475569" text-anchor="middle">text</text>
  <path d="M734,262 L708,262" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="720" y="282" font-size="11" fill="#059669" text-anchor="middle">WAV</text>

  <!-- backends -->
  <text x="736" y="106" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">BACKEND (PICK ONE)</text>
  <rect x="736" y="122" width="208" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="750" y="146" font-size="14" font-weight="700" fill="#064e3b">macOS voices</text>
  <text x="750" y="166" font-size="12" fill="#065f46">default on a Mac · nothing to install</text>
  <rect x="736" y="192" width="208" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="750" y="216" font-size="14" font-weight="700" fill="#0f172a">Kokoro, in the plugin</text>
  <text x="750" y="236" font-size="12" fill="#475569">fastest Kokoro · ~1 GB setup</text>
  <rect x="736" y="262" width="208" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="750" y="286" font-size="14" font-weight="700" fill="#0f172a">Kokoro server</text>
  <text x="750" y="306" font-size="12" fill="#475569">Docker container · also Linux</text>

  <!-- speaker -->
  <rect x="496" y="338" width="208" height="34" rx="17" fill="#0f172a"/>
  <text x="600" y="360" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">🔊  your speakers</text>
  <line x1="600" y1="322" x2="600" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <text x="28" y="414" font-size="12.5" fill="#475569">Playback always happens on your machine. A container can't make sound on macOS (Docker runs in a VM without audio), so the</text>
  <text x="28" y="434" font-size="12.5" fill="#475569">Kokoro server only returns audio bytes. Swapping the backend changes the voice, nothing else about what is spoken or how.</text>
</svg>
