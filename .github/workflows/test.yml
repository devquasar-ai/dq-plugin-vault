name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyflakes pyyaml
      - run: python -m pyflakes plugins/dq-session-db plugins/dq-local-tts/scripts
      - name: Frontmatter of every skill and command is valid YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob("plugins/**/*.md", recursive=True):
              s = open(f).read()
              if s.startswith("---\n"):
                  try:
                      yaml.safe_load(s.split("---\n")[1])
                  except yaml.YAMLError as e:
                      print(f"{f}: {e}"); bad += 1
          sys.exit(bad)
          PY
      - run: python -m unittest discover -s plugins/dq-session-db/tests -v
